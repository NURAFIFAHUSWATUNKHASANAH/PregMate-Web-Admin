{% extends 'layouts/layout.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/artikel.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-card">
    <header class="form-header">
        <h2>
            <i class="fas fa-file-circle-plus" style="color: var(--primary);"></i>
            Tambah Artikel Baru
        </h2>
        <a href="{{ url_for('artikel_bp.index') }}" class="btn-back">
            <i class="fas fa-arrow-left"></i> Kembali
        </a>
    </header>

    <form action="{{ url_for('artikel_bp.create') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title"><i class="fas fa-heading icon-label"></i> Judul Artikel</label>
            <input type="text" name="title" id="title" required class="form-control" placeholder="Masukkan judul yang menarik...">
        </div>

        <div class="form-group">
            <label for="content"><i class="fas fa-align-left icon-label"></i> Isi Konten</label>
            <textarea name="content" id="content" rows="10" required class="form-control" placeholder="Tuliskan isi artikel secara lengkap di sini..."></textarea>
        </div>

        <div class="form-group">
            <label for="image"><i class="fas fa-image icon-label"></i> Gambar Sampul (Upload)</label>
            <input type="file" name="image" id="image" accept="image/*" class="form-control" style="padding: 10px;">
            <small style="color: var(--text-muted); margin-top: 5px; display: block;">Format: JPG, PNG, atau WEBP.</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">
                <i class="fas fa-save"></i> Simpan Artikel
            </button>
            <a href="{{ url_for('artikel_bp.index') }}" class="btn-cancel">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
