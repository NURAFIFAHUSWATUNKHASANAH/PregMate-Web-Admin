{% extends 'layouts/layout.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/artikel.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-container">
    
    <div class="form-wrapper"> <!-- Memastikan lebar konsisten -->

        <!-- HEADER -->
        <div class="form-header">
            <div class="form-title-group">
                <i class="fas fa-file-circle-plus"></i>
                <div>
                    <h2>Tambah Artikel</h2>
                    <p class="subtitle">Buat konten edukasi kesehatan baru untuk pengguna</p>
                </div>
            </div>
        </div>

        <!-- CARD -->
        <div class="form-card">

            <form action="{{ url_for('artikel_bp.create') }}" method="POST" enctype="multipart/form-data">

                <!-- JUDUL ARTIKEL -->
                <div class="form-group">
                    <label>Judul Artikel</label>
                    <div class="input-icon">
                        <i class="fas fa-heading"></i>
                        <input 
                            type="text" 
                            name="title" 
                            id="title" 
                            class="form-control"
                            placeholder="Masukkan judul yang menarik..."
                            required
                        >
                    </div>
                </div>

                <!-- ISI KONTEN -->
                <div class="form-group">
                    <label>Isi Konten</label>
                    <div class="input-icon">
                        <!-- Icon diletakkan agak ke atas untuk textarea -->
                        <i class="fas fa-align-left" style="top: 20px; transform: none;"></i> 
                        <textarea 
                            name="content" 
                            id="content" 
                            rows="10" 
                            class="form-control" 
                            placeholder="Tuliskan isi artikel secara lengkap di sini..."
                            required
                            style="padding-top: 15px;"
                        ></textarea>
                    </div>
                </div>

                <!-- UPLOAD GAMBAR -->
                <div class="form-group">
                    <label>Gambar Sampul</label>
                    <div class="input-icon">
                        <i class="fas fa-image"></i>
                        <input 
                            type="file" 
                            name="image" 
                            id="image" 
                            accept="image/*" 
                            class="form-control"
                            style="padding-top: 12px;"
                        >
                    </div>
                    <small style="color: var(--text-muted); margin-top: 8px; display: block; margin-left: 5px;">
                        <i class="fas fa-info-circle"></i> Format: JPG, PNG, atau WEBP.
                    </small>
                </div>

                <!-- ACTION BUTTONS (GRID 2 KOLOM) -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        Simpan
                    </button>
                    <!-- Tombol Batal -->
                    <a href="{{ url_for('artikel_bp.index') }}" class="btn-cancel">
                        Batal
                    </a>

                    <!-- Tombol Simpan -->

                </div>

            </form>

        </div>

    </div>
</div>
{% endblock %}
