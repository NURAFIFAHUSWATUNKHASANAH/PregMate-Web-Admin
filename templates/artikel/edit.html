{% extends 'layouts/layout.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/artikel.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-container">
    
    <div class="form-wrapper"> <!-- 🔥 Wrapper lebar konsisten dengan user -->

        <!-- HEADER -->
        <div class="form-header">
            <div class="form-title-group">
                <i class="fas fa-file-pen"></i>
                <div>
                    <h2>Edit Artikel</h2>
                    <p class="subtitle">Perbarui informasi edukasi dan konten kesehatan</p>
                </div>
            </div>
        </div>

        <!-- CARD -->
        <div class="form-card">

            <form action="{{ url_for('artikel_bp.edit', id=article._id) }}" method="POST" enctype="multipart/form-data">

                <!-- JUDUL ARTIKEL -->
                <div class="form-group">
                    <label>Judul Artikel</label>
                    <div class="input-icon">
                        <i class="fas fa-heading"></i>
                        <input 
                            type="text" 
                            name="title" 
                            value="{{ article.title }}" 
                            class="form-control"
                            placeholder="Masukkan judul artikel..."
                            required
                        >
                    </div>
                </div>

                <!-- ISI KONTEN -->
                <div class="form-group">
                    <label>Isi Konten</label>
                    <div class="input-icon">
                        <!-- Icon tetap di atas untuk textarea -->
                        <i class="fas fa-align-left" style="top: 20px; transform: none;"></i> 
                        <textarea 
                            name="content" 
                            rows="10" 
                            class="form-control" 
                            placeholder="Tulis konten artikel di sini..."
                            required
                            style="padding-top: 15px;"
                        >{{ article.content }}</textarea>
                    </div>
                </div>

                <!-- PREVIEW GAMBAR SAAT INI -->
                <div class="form-group">
                    <label>Gambar Saat Ini</label>
                    {% if article.imageUrl %}
                        <div class="current-image-wrapper" style="background: #f8fafc; padding: 15px; border-radius: 20px; border: 1.5px solid #e2e8f0;">
                            <img src="{{ article.imageUrl }}" alt="Preview" class="img-preview" style="max-width: 100%; border-radius: 12px; display: block;">
                        </div>
                    {% else %}
                        <div class="empty-image-state" style="padding: 20px; background: #f8fafc; border-radius: 15px; text-align: center; color: var(--text-muted); border: 1.5px dashed #e2e8f0;">
                            <i class="fas fa-image" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                            <span style="font-size: 0.85rem; font-weight: 600;">Tidak ada gambar terunggah</span>
                        </div>
                    {% endif %}
                </div>

                <!-- UPLOAD GAMBAR BARU -->
                <div class="form-group">
                    <label>Ganti Gambar (Opsional)</label>
                    <div class="input-icon">
                        <i class="fas fa-cloud-arrow-up"></i>
                        <input 
                            type="file" 
                            name="image" 
                            accept="image/*" 
                            class="form-control"
                            style="padding-top: 12px;"
                        >
                    </div>
                </div>

                <!-- ACTION BUTTONS (GRID 2 KOLOM) -->
                <div class="form-actions">
                                        <!-- Tombol Update -->
                    <button type="submit" class="btn-submit">
                        Update
                    </button>
                    <!-- Tombol Kembali -->
                    <a href="{{ url_for('artikel_bp.index') }}" class="btn-cancel">
                        Kembali
                    </a>
                </div>

            </form>

        </div>

    </div>
</div>
{% endblock %}
