{% extends 'layouts/layout.html' %}

{% block content %}
<h2>
    Data Kategori
</h2>
<a href="/admin/kategori/create">Tambah</a>
<table>
    <tr>
        <th>Nama</th>
        <th>Aksi</th>
    </tr>
    {%for item in data%}
    <tr>
        <td>
            {{item.nama}}
        </td>
        <td>
            <a href="/admin/kategori/edit">Edit</a>
            <a href="/admin/kategori/delete">Hapus</a>
        </td>
    </tr>
    {%endfor%}
</table>

{% endblock %}
