<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PregMate | Dari Dua Hati, Menyambut Satu Kehidupan{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/widget/navbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/widget/sidebar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/widget/footer.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}">
  {% block extra_css %}{% endblock %}
</head>

<body>
  <div class="container">
    <!-- Navbar -->
    {% include 'components/navbar.html' %}

    <!-- Main Content Section -->
    <div class="main">
      <!-- Sidebar -->
      {% include 'components/sidebar.html' %}

      <!-- Content Area -->
      <div class="content">
        {% block content %}
        <!-- Content halaman akan di-inject di sini -->
        {% endblock %}
      </div>
    </div>

    <!-- Footer -->
    {% include 'components/footer.html' %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>
