<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysioCare | Secure Gateway</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --midnight: #0C2D57;
            --rose: #FF8E9E;
            --soft: #FAFBFF;

            --primary: var(--midnight);
            --accent: var(--rose);

            --text-main: #0F172A;
            --text-muted: #64748B;

            --glass: rgba(255, 255, 255, 0.75);
            --border: rgba(226, 232, 240, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--soft);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .mesh-bg {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 10% 10%, rgba(12, 45, 87, 0.12), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(255, 142, 158, 0.15), transparent 50%);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            width: 100%;
            max-width: 420px;
            padding: 3rem;
            border-radius: 30px;
            border: 1px solid var(--border);

            box-shadow:
                0 30px 60px rgba(12, 45, 87, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);

            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-box {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--midnight), var(--rose));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            color: white;
            font-size: 1.6rem;
        }

        .header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.6rem;
            color: var(--midnight);
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--midnight);
            margin-bottom: 0.5rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 0.95rem;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--midnight);
            box-shadow: 0 0 0 4px rgba(12, 45, 87, 0.08);
        }

        /* PASSWORD TOGGLE */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748B;
            font-size: 0.9rem;
        }

        .toggle-password:hover {
            color: var(--midnight);
        }

        .btn-signin {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--midnight), #123a75);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
        }

        .btn-signin:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="mesh-bg"></div>
    <div class="blob" style="width: 300px; height: 300px; background: var(--primary); top: -100px; right: -50px;"></div>
    <div class="blob" style="width: 250px; height: 250px; background: var(--rose); bottom: -80px; left: -50px;"></div>

    <div class="login-card">
        <div class="header">
            <div class="logo-box">
                <i class="fas fa-shield-halved"></i>
            </div>
            <h1>PregMate Dashboard</h1>
            <p>Sistem Manajemen Kehamilan Terpadu</p>
        </div>

        <form method="POST" action="/admin/login">

            <div class="form-group">
                <label class="label">ID ADMINISTRATOR</label>
                <div class="input-wrapper">
                    <input type="text" name="username" placeholder="Nama pengguna" required>
                </div>
            </div>

            <div class="form-group">
                <label class="label">KATA SANDI</label>
                <div class="input-wrapper password-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-signin">
                Masuk
            </button>

        </form>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = password.type === 'password' ? 'text' : 'password';
            password.type = type;

            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>

</body>

</html>
