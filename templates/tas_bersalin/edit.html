{% extends 'layouts/layout.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-container">
    
    <div class="form-wrapper">

        <!-- HEADER -->
        <div class="form-header">
            <div class="form-title-group">
                <i class="fas fa-suitcase-medical"></i>
                <div>
                    <h2>Edit Item Tas Bersalin</h2>
                    <p class="subtitle">Perbarui perlengkapan tas bersalin</p>
                </div>
            </div>
        </div>

        <!-- CARD -->
        <div class="form-card">

            <form method="POST">

                <!-- NAMA -->
                <div class="form-group">
                    <label>Nama Item</label>
                    <div class="input-icon">
                        <i class="fas fa-tag"></i>
                        <input 
                            type="text" 
                            name="name" 
                            value="{{ item.name }}" 
                            class="form-control"
                            placeholder="Masukkan nama item..."
                            required
                        >
                    </div>
                </div>

                <!-- DETAIL -->
                <div class="form-group">
                    <label>Detail</label>
                    <div class="input-icon">
                        <i class="fas fa-align-left"></i>
                        <textarea 
                            name="detail" 
                            rows="4"
                            class="form-control"
                            placeholder="Deskripsi item..."
                        >{{ item.detail }}</textarea>
                    </div>
                </div>

                <!-- KATEGORI -->
                <div class="form-group">
                    <label>Kategori</label>
                    <div class="input-icon">
                        <i class="fas fa-layer-group"></i>
                        <select name="category" class="form-control" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="ibu" {% if item.category == 'ibu' %}selected{% endif %}>Ibu</option>
                            <option value="bayi" {% if item.category == 'bayi' %}selected{% endif %}>Bayi</option>
                            <option value="pendamping" {% if item.category == 'pendamping' %}selected{% endif %}>Pendamping</option>
                        </select>
                    </div>
                </div>

                <!-- TYPE (WAJIB / OPTIONAL) -->
                <div class="form-group">
                    <label>Jenis Item</label>
                    <div class="input-icon">
                        <i class="fas fa-circle-info"></i>
                        <select name="type" class="form-control" required>
                            <option value="">-- Pilih Jenis --</option>
                            <option value="wajib" {% if item.type == 'wajib' %}selected{% endif %}>Wajib</option>
                            <option value="optional" {% if item.type == 'optional' %}selected{% endif %}>Optional</option>
                        </select>
                    </div>
                </div>

                <!-- ACTION -->
                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        Update
                    </button>
                    <a href="{{ url_for('tasbersalin_bp.admin_index_tas') }}" class="btn-cancel">
                        Kembali
                    </a>



                </div>

            </form>

        </div>

    </div>
</div>
{% endblock %}
