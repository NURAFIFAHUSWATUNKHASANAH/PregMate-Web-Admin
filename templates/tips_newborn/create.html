{% extends 'layouts/layout.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-card">

    <!-- HEADER -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
        <i class="fas fa-video" style="color:#0C2D57; font-size:20px;"></i>
        <h2 style="margin:0; color:#0C2D57;">Tambah Tips Newborn</h2>
    </div>

    <form method="POST" enctype="multipart/form-data">

        <!-- TITLE -->
        <div class="form-group">
            <label>Judul Tips</label>
            <input type="text" name="title" class="form-control" placeholder="Masukkan judul tips..." required>
        </div>

        <!-- DESC -->
        <div class="form-group">
            <label>Deskripsi</label>
            <textarea name="desc" class="form-control" placeholder="Masukkan deskripsi tips..."></textarea>
        </div>

        <!-- VIDEO -->
        <div class="form-group">
            <label>Upload Video</label>
            <input type="file" name="video" accept="video/*" class="form-control" required>
        </div>

        <!-- STEPS -->
        <div class="form-group">
            <label>Langkah-langkah</label>

            <div id="steps-container">
                <input type="text" name="steps[]" class="form-control step-input" placeholder="Langkah 1" required>
            </div>

<button type="button" onclick="addStep()" class="btn-add-field">
    <i class="fas fa-plus"></i>
    Tambah Field
</button>
        </div>

        <!-- BUTTON -->
        <div class="form-actions">
            <button class="btn-submit"> 
                Simpan
            </button>

            <a href="{{ url_for('tips_bp.admin_index_tips') }}" class="btn-cancel">
                Batal
            </a>
        </div>

    </form>

</div>
{% endblock %}

{% block extra_js %}
<script>
let stepCount = 1;

function addStep() {
    stepCount++;

    const container = document.getElementById("steps-container");

    const wrapper = document.createElement("div");
    wrapper.className = "step-field-wrapper";

    wrapper.innerHTML = `
        <input 
            type="text" 
            name="steps[]" 
            class="form-control step-input" 
            placeholder="Langkah ${stepCount}" 
            required
        >

        <button 
            type="button" 
            class="btn-remove-field"
            onclick="this.parentElement.remove()"
        >
            <i class="fas fa-times"></i>
        </button>
    `;

    container.appendChild(wrapper);
}
</script>
{% endblock %}
