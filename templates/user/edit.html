{% extends 'layouts/layout.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="form-container">
    
    <div class="form-wrapper"> <!-- 🔥 WRAPPER BIAR LEBAR KONSISTEN -->

        <!-- HEADER -->
        <div class="form-header">
            <div class="form-title-group">
                <i class="fas fa-user-pen"></i>
                <div>
                    <h2>Edit User</h2>
                    <p class="subtitle">Perbarui informasi akun pengguna</p>
                </div>
            </div>
        </div>

        <!-- CARD -->
        <div class="form-card">

            <form method="POST">

                <!-- NAMA -->
                <div class="form-group">
                    <label>Nama</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            name="nama" 
                            value="{{ user.nama }}" 
                            class="form-control"
                            placeholder="Masukkan nama..."
                            required
                        >
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input 
                            type="email" 
                            name="email" 
                            value="{{ user.email }}" 
                            class="form-control"
                            placeholder="Masukkan email..."
                            required
                        >
                    </div>
                </div>

                <!-- ROLE -->
                <div class="form-group">
                    <label>Role</label>
                    <div class="input-icon">
                        <i class="fas fa-user-tag"></i>
                        <select name="role" class="form-control" required>
                            <option value="">-- Pilih Role --</option>
                            <option value="ibu" {% if user.role=='ibu' %}selected{% endif %}>Ibu</option>
                            <option value="pendamping" {% if user.role=='pendamping' %}selected{% endif %}>Pendamping</option>
                        </select>
                    </div>
                </div>

                <!-- ACTION -->
                <div class="form-actions">
                    
                    <a href="{{ url_for('admin_user.index') }}" class="btn-cancel">
                        <i class="fas fa-arrow-left"></i>
                        Kembali
                    </a>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i>
                        Update
                    </button>

                </div>

            </form>

        </div>

    </div>
</div>
{% endblock %}
